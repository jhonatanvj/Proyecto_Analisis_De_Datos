# Data sources used by the pipeline, one entry per source.
# src/volcano_pipeline/config.py loads this file. Keys or passwords go in .env, never here.

project:
  hazard: volcanic_activity
  geographic_scope: united_states     # HANS alert levels only exist for US volcanoes
  country_filter: United States       # GVP 'Country' value; ~165 Holocene volcanoes (AK, HI, Cascades, CNMI, ...)
  historical_start: "2010-01-01"      # earthquakes window (eruptions: full Holocene record, analysis from 1960)
  eruption_analysis_start_year: 1960
  current_window_days: 7              # "current situation" = current HANS alert level + earthquakes of the last 7 days
  user_agent_env: HTTP_USER_AGENT     # name of the env var holding the User-Agent/contact

spatial:
  volcano_radius_km: 30               # earthquake counted as "near" a volcano within this distance
  min_magnitude: 1.0                  # US networks are complete at low magnitudes; also applied to the feed
  volcano_selection:                  # which volcanoes get radial FDSN queries
    min_last_eruption_year: null      # null = every US volcano (quiet Cascades volcanoes need a baseline too)

event_matching:                       # event_group rules (storage/event_groups.py), rebuilt after each load
  same_quake:                         # one earthquake reported by two networks under two ids
    max_seconds: 16                   # ComCat associates origins within 16 s
    max_km: 10
    max_mag_diff: 0.5
    neighbours: 3                     # compare each event with the next 3 in time (window function)
  volcano_episode:                    # alert notices, eruptions and nearby earthquakes of one volcano in one ISO week
    anchor_types: [alert_notice, eruption]

governance:                           # Workshop 4: pass / warn status of the governance dashboard
  # One threshold per KPI, applied to its headline value (gold/governance.py, section kpi_summary).
  # rule max: pass when value <= threshold; rule min: pass when value >= threshold.
  # Baselines measured on 2026-11-19 (notebooks/03_data_quality_findings.ipynb, finding ids F01-F24).
  thresholds:
    null_rate:           {rule: max, value: 5.0}     # mean % empty per field; baseline 3.6 % (known gaps F01-F04)
    duplicate_rate:      {rule: max, value: 0.0}     # % exact copies in Silver; must be 0 (F08: 0.095 %, a bug)
    schema_compliance:   {rule: min, value: 100.0}   # lowest % of conforming files of a topic; baseline 100 %
    quarantine_rate:     {rule: max, value: 2.0}     # % quarantined, all sources; baseline 0.68 % (business rules)
    outlier_rate:        {rule: max, value: 15.0}    # highest % outliers of a field; baseline 9.4 % (depth)
    text_length:         {rule: max, value: 0.1}     # % notices with encoding errors; baseline 0.054 % (F21)
    freshness:           {rule: min, value: 100.0}   # % sources with a file younger than max(24 h, 2 x schedule)
    ingestion_frequency: {rule: min, value: 80.0}    # usgs_feed: % of the last 7 full days' hours with a new file

indicator:                            # Volcano Activity Indicator (VAI), preliminary - Workshop #4
  weights: {reported: 0.45, seismic: 0.35, eruptive: 0.20}
  # R = official USGS alert level (HANS); the aviation colour code is shown, not scored separately
  alert_level_scores: {NORMAL: 0.0, ADVISORY: 0.4, WATCH: 0.7, WARNING: 1.0}
  weekly_report_bonus: {new: 0.2, ongoing: 0.1}   # optional source; R is capped at 1.0
  seismic_min_baseline_events: 20     # below this, seismic component = not available
  eruptive_decay_years: 25
  levels: {LOW: 0, MODERATE: 25, ELEVATED: 50, HIGH: 75}
  # Workshop 4: S compares the earthquakes of the last seismic_window_days with every week since
  # history_start (a Monday, as Spark weeks start on Monday), counting the weeks with no earthquake
  history_start: "2010-01-04"
  seismic_window_days: 7
  # region filter of the VAI ranking (US6): the USGS observatory of the volcano (HANS volcano list),
  # or its GVP subregion when HANS does not list it
  regions:
    observatories:
      avo: Alaska
      hvo: Hawaii & American Samoa
      cvo: Cascades & Pacific Northwest
      calvo: California
      yvo: Yellowstone & Interior West
      nmi: Northern Mariana Islands
    subregions:
      Aleutian Ridge Volcanic Arc: Alaska
      Alaska Peninsula Volcanic Arc: Alaska
      Northern Alaska-Bering Sea Volcanic Province: Alaska
      Northern Cordilleran Volcanic Province: Alaska
      Queen Charlotte Volcano Group: Alaska
      Wrangell Volcanic Arc: Alaska
      Hawaiian-Emperor Hotspot Volcano Group: Hawaii & American Samoa
      Samoan Hotspot Volcano Group: Hawaii & American Samoa
      High Cascades Volcanic Arc: Cascades & Pacific Northwest
      Garibaldi Volcanic Arc: Cascades & Pacific Northwest
      High Lava Plains Volcanic Province: Cascades & Pacific Northwest
      Northeast Pacific Rifts Volcanic Province: Cascades & Pacific Northwest
      California Coast Ranges Volcano Group: California
      Gulf of California Rift Volcanic Province: California
      Basin and Range Volcanic Province: Yellowstone & Interior West
      Yellowstone-Snake River Hotspot Volcano Group: Yellowstone & Interior West
      Mariana Volcanic Arc: Northern Mariana Islands

sources:

  # Historical sources
  - source_id: gvp_volcanoes
    name: Smithsonian GVP - Volcanoes of the World - Holocene Volcanoes
    role: historical            # static reference entity (volcano catalog)
    owner: Smithsonian Institution, Global Volcanism Program
    url: https://webservices.volcano.si.edu/geoserver/GVP-VOTW/ows
    params:
      service: WFS
      version: "1.0.0"
      request: GetFeature
      typeName: GVP-VOTW:Smithsonian_VOTW_Holocene_Volcanoes
      outputFormat: application/json
      CQL_FILTER: "Country='United States'"   # server-side filter, verified 2026-11-09 (165 features)
    format: geojson
    auth: none
    rate_limit: "not published - be polite: 1 request per run, cache locally"
    license: "Smithsonian GVP terms of use; cite database version and DOI"
    citation: >-
      Global Volcanism Program, 2026. [Database] Volcanoes of the World (v. 5.4.0; 7 Aug 2026).
      Distributed by Smithsonian Institution, compiled by Venzke, E.
      https://doi.org/10.5479/si.GVP.VOTW5-2026.5.4
    schedule: "@monthly"        # re-check for new database versions
    database_version: "5.4.0"   # update with the citation when GVP publishes a new version
    watermark_field: database_version
    duplicate_key: [Volcano_Number]

  - source_id: gvp_eruptions
    name: Smithsonian GVP - Volcanoes of the World - Holocene Eruptions
    role: historical
    owner: Smithsonian Institution, Global Volcanism Program
    url: https://webservices.volcano.si.edu/geoserver/GVP-VOTW/ows
    params:
      service: WFS
      version: "1.0.0"
      request: GetFeature
      typeName: GVP-VOTW:Smithsonian_VOTW_Holocene_Eruptions
      outputFormat: application/json
    format: geojson
    auth: none
    rate_limit: "not published - single bulk request (~11k features), cache locally"
    scope_note: "layer has no Country field: download the full layer, keep eruptions whose Volcano_Number is a US volcano"
    license: "Smithsonian GVP terms of use; cite database version and DOI"
    citation: >-
      Global Volcanism Program, 2026. [Database] Volcanoes of the World (v. 5.4.0; 7 Aug 2026).
      https://doi.org/10.5479/si.GVP.VOTW5-2026.5.4
    schedule: "@monthly"
    database_version: "5.4.0"
    watermark_field: database_version + content_hash
    duplicate_key: [Eruption_Number]

  - source_id: usgs_fdsn
    name: USGS FDSN Event Web Service (ComCat)
    role: historical
    owner: U.S. Geological Survey, Earthquake Hazards Program
    url: https://earthquake.usgs.gov/fdsnws/event/1/query
    params:
      format: csv
      orderby: time-asc
    format: csv
    auth: none
    rate_limit: "max 20,000 events per request; partition by volcano, then by year (month if needed) when count > 20,000"
    license: "Public domain (U.S. Government). Credit: U.S. Geological Survey"
    citation: "U.S. Geological Survey, Earthquake Hazards Program, ANSS Comprehensive Catalog (ComCat)"
    schedule: "@daily"          # also used to catch revisions with updatedafter=<watermark>
    watermark_field: updated
    duplicate_key: [id]
    # Incremental mode (bronze_ingestion, ingest.py --mode incremental): events created OR revised
    # since the watermark (updatedafter), one query per US volcanic region instead of 165 radial
    # queries; Silver keeps only events within volcano_radius_km of a volcano. The boxes contain
    # every US volcano with a 30 km margin (checked against the 169 volcanoes on 2026-11-19).
    incremental:
      event_start: "2010-01-01"  # FDSN defaults starttime to 30 days ago; revisions of older events count too
      overlap_minutes: 60
      first_window_days: 7
      max_events: 20000          # FDSN limit per request; a full answer means the window is too wide
      regions:                   # [min_lat, max_lat, min_lon, max_lon]
        alaska: [50, 67, -180, -129]
        aleutians_west: [50, 56, 172, 180]
        west_conus: [31, 50, -129, -103]
        hawaii: [18, 23, -161, -154]
        marianas: [12.5, 24.5, 142.5, 147]
        american_samoa: [-15.5, -13, -172, -168]

  # Incremental sources
  - source_id: usgs_hans
    name: USGS HANS public API - volcano alert levels and aviation colour codes
    role: incremental
    owner: U.S. Geological Survey, Volcano Hazards Program
    url: https://volcanoes.usgs.gov/hans-public/api
    endpoints:                  # verified 2026-11-09
      monitored: volcano/getMonitoredVolcanoes     # latest notice per monitored volcano (~69 rows) - polled
      elevated: volcano/getElevatedVolcanoes       # only volcanoes above NORMAL/GREEN
      us_volcanoes: volcano/getUSVolcanoes         # ~170 US volcanoes with vnum + coordinates (reference)
      notice: notice/getNotice/{notice_identifier} # full text of one notice
    format: json
    auth: none
    rate_limit: "not published - poll hourly, 1 request per poll"
    license: "Public domain (U.S. Government). Credit: U.S. Geological Survey Volcano Hazards Program"
    citation: "U.S. Geological Survey, Volcano Hazards Program, Hazard Notification System (HANS) public API"
    schedule: "0 * * * *"
    watermark_field: sent_unixtime
    duplicate_key: [vnum, notice_identifier]
    # Monitored volcanoes that are not in the GVP Holocene list, so Silver has no coordinates for
    # them. The loader adds them to the volcano table (is_holocene = false) before their notices.
    # Approximate summit / caldera centre, WGS84.
    extra_volcanoes:
      - {vnum: 311161, name: Korovin, latitude: 52.381, longitude: -174.166, observatory: avo}
      - {vnum: 323180, name: Coso Volcanic Field, latitude: 36.03, longitude: -117.82, observatory: calvo}
      - {vnum: 323822, name: Long Valley Caldera, latitude: 37.70, longitude: -118.87, observatory: calvo}
      - {vnum: 325010, name: Yellowstone, latitude: 44.43, longitude: -110.67, observatory: yvo}

  - source_id: usgs_hans_notices
    name: USGS HANS notice search - full text of every volcano notice (daily/weekly updates, VAN, VONA...)
    role: incremental           # hourly: notices sent since the watermark; history loaded once by backfill
    owner: U.S. Geological Survey, Volcano Hazards Program
    url: https://volcanoes.usgs.gov/hans-public/api
    endpoints:                  # verified 2026-11-19
      search: search/search     # POST JSON body, 20 notices per page with their full HTML
      preflight: search/preflight
    format: json
    auth: none
    rate_limit: "not published - one page per second; ~830 pages for the whole archive since 2010"
    license: "Public domain (U.S. Government). Credit: U.S. Geological Survey Volcano Hazards Program"
    citation: "U.S. Geological Survey, Volcano Hazards Program, Hazard Notification System (HANS) public API"
    schedule: "0 * * * *"
    historical_start: "2010-01-01"
    overlap_hours: 6            # re-read a few hours before the watermark: a late notice is not missed, dedup drops repeats
    first_window_days: 30       # incremental run with no watermark yet (before the backfill)
    page_pause_seconds: 1.0
    watermark_field: sentUnixtime
    duplicate_key: [noticeIdentifier, noticeTypeCd]   # a VAN and its VONA share the identifier

  - source_id: usgs_hans_volcanoes
    name: USGS HANS public API - US volcano reference list (volcano code, vnum, region, coordinates)
    role: optional              # reference data, refreshed monthly; maps notice volcano codes to vnum and region
    owner: U.S. Geological Survey, Volcano Hazards Program
    url: https://volcanoes.usgs.gov/hans-public/api
    endpoints:
      us_volcanoes: volcano/getUSVolcanoes
    format: json
    auth: none
    rate_limit: "one request per month"
    license: "Public domain (U.S. Government). Credit: U.S. Geological Survey Volcano Hazards Program"
    citation: "U.S. Geological Survey, Volcano Hazards Program, Hazard Notification System (HANS) public API"
    schedule: "@monthly"
    watermark_field: content_sha256
    duplicate_key: [volcano_cd]

  - source_id: usgs_feed
    name: USGS real-time GeoJSON summary feed (all earthquakes, past 7 days)
    role: incremental
    owner: U.S. Geological Survey, Earthquake Hazards Program
    url: https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_week.geojson
    alt_url_day: https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson
    format: geojson
    auth: none
    rate_limit: "feed regenerated every minute; poll every 15 min (USGS recommends not more than once per minute)"
    license: "Public domain (U.S. Government). Credit: U.S. Geological Survey"
    citation: "U.S. Geological Survey, Earthquake Hazards Program, real-time GeoJSON feeds"
    schedule: "*/15 * * * *"
    watermark_field: properties.updated
    duplicate_key: [id]

  - source_id: usgs_volcano_updates
    name: USGS Volcano Hazards Program - Volcano Updates page (web scraping)
    role: incremental
    owner: U.S. Geological Survey, Volcano Hazards Program
    url: https://www.usgs.gov/programs/VHP/volcano-updates
    format: html                # server-rendered; parsed with BeautifulSoup, stored in Bronze as JSON records
    auth: none
    rate_limit: "robots.txt allows /programs/; one request per hour (page is ~6.6 MB)"
    license: "Public domain (U.S. Government). Credit: U.S. Geological Survey Volcano Hazards Program"
    citation: "U.S. Geological Survey, Volcano Hazards Program, Volcano Updates"
    schedule: "@hourly"
    watermark_field: content_sha256 of the page
    duplicate_key: [record_type, observatory, notice_url | notice_number | issued_raw]

  # Optional sources (extra context, not part of the required four)
  - source_id: gvp_weekly_rss
    name: Smithsonian / USGS Weekly Volcanic Activity Report (RSS)
    role: optional              # few US volcanoes per week and the feed was stale for weeks
    owner: Smithsonian GVP and USGS Volcano Hazards Program
    url: https://volcano.si.edu/news/WeeklyVolcanoRSS.xml
    alt_url_cap: https://volcano.si.edu/news/WeeklyVolcanoCAP.xml
    format: rss_xml             # ISO-8859-1 encoded
    auth: none
    rate_limit: "published weekly (Wednesdays by 23:00 UTC); poll every 6 h with ETag/Last-Modified"
    license: "Smithsonian GVP terms of use; cite the Weekly Volcanic Activity Report"
    citation: "Global Volcanism Program, Smithsonian / USGS Weekly Volcanic Activity Report, Sennert, S. (ed.)"
    schedule: "0 */6 * * *"
    watermark_field: report_week_end (from item title) + pubDate
    duplicate_key: [volcano_number, report_week_start]
    enabled: true

  - source_id: gdacs_vo
    name: GDACS events API - volcanoes (type VO)
    role: optional
    owner: European Commission JRC / UN OCHA
    url: https://www.gdacs.org/gdacsapi/api/events/geteventlist/SEARCH
    params:
      eventlist: VO
    format: geojson
    auth: none
    license: "GDACS terms of use; attribution to GDACS"
    schedule: "0 */6 * * *"
    watermark_field: properties.datemodified
    duplicate_key: [eventid, episodeid]
    enabled: false
